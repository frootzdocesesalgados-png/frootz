[build]
  # Build from the repo root so all pnpm workspace packages (lib/*) are available
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/frootz run build:netlify"
  publish = "artifacts/frootz/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  # VITE_API_BASE_URL must be set in Netlify Dashboard → Site Settings → Environment Variables
  # Example: https://frootz-api.up.railway.app

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
